<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bilbao</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bilbao">
<meta name="theme-color" content="#162528">
<script>
  // Ícone do app = o dock do Bilbao do PC (barras, picareta e sino). Vira PNG para o iOS e o Android aceitarem.
  const _svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#223a3d'/><stop offset='1' stop-color='#0f1c1e'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(#g)'/><rect x='8' y='32' width='84' height='36' rx='18' fill='#213538'/><g fill='none' stroke-linecap='round' stroke-linejoin='round'><g transform='translate(12.4 34.9) scale(.56)' stroke='#93e9ba' stroke-width='3.6'><path d='M17 35V28M24 35V21M31 35V25M38 35V15'/></g><g transform='translate(34.9 34.9) scale(.56)' stroke='#ffcc79'><path d='M19 37L32 20' stroke-width='4.4'/><path d='M20 16Q31 19 38 28' stroke-width='3.6'/></g><g transform='translate(57.4 34.9) scale(.56)' stroke='#a4c9ff' stroke-width='2.8'><path d='M17 33L20 29V19Q20 13 27 13Q34 13 34 19V29L37 33Z'/><path d='M23 35A4 4 0 0 0 31 35'/></g></g></svg>`;
  const _svgUrl = 'data:image/svg+xml,' + encodeURIComponent(_svg);
  function _manifesto(icones) {
    const m = { name: 'Bilbao', short_name: 'Bilbao', start_url: location.pathname, scope: location.pathname.replace(/[^/]*$/, ''),
      display: 'standalone', background_color: '#162528', theme_color: '#162528', icons: icones };
    const l = document.createElement('link'); l.rel = 'manifest';
    l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
    document.head.appendChild(l);
  }
  (function () {
    const apple = document.createElement('link'); apple.rel = 'apple-touch-icon'; apple.href = _svgUrl; document.head.appendChild(apple);
    const img = new Image();
    img.onload = () => {
      try {
        const png = s => { const c = document.createElement('canvas'); c.width = c.height = s; c.getContext('2d').drawImage(img, 0, 0, s, s); return c.toDataURL('image/png'); };
        apple.href = png(180);
        _manifesto([192, 512].map(s => ({ src: png(s), sizes: s + 'x' + s, type: 'image/png', purpose: 'any' })));
      } catch (e) { _manifesto([{ src: _svgUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' }]); }
    };
    img.onerror = () => _manifesto([{ src: _svgUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' }]);
    img.src = _svgUrl;
  })();
</script>
<style>
  :root { --bg:#162528; --bg2:#0f1c1e; --tile:#213538; --tile2:#2a4346; --ink:#f2f4e8; --soft:#b1c6c2; --mint:#93e9ba; --gold:#ffcc79; --blue:#a4c9ff; --red:#ff8a7a;
    --violet:#b9a3ff; --rose:#ff9fb8; --linha:rgba(255,255,255,.06); --mola:cubic-bezier(.34,1.45,.5,1); --suave:cubic-bezier(.2,.8,.2,1); }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); }
  body { color:var(--ink); font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100dvh; overflow-x:hidden;
    background:radial-gradient(120% 60% at 0% 0%,rgba(147,233,186,.10),transparent 55%),radial-gradient(90% 50% at 100% 12%,rgba(164,201,255,.07),transparent 60%),var(--bg);
    background-attachment:fixed; padding:0 16px calc(118px + env(safe-area-inset-bottom)); font-variant-numeric:tabular-nums; }
  button { font:inherit; color:inherit; cursor:pointer; }

  /* topo */
  header { position:sticky; top:0; z-index:5; margin:0 -16px 10px; padding:max(14px,env(safe-area-inset-top)) 18px 10px; display:flex; justify-content:space-between; align-items:center;
    background:linear-gradient(180deg,rgba(22,37,40,.96),rgba(22,37,40,.78)); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  h1 { font-size:15px; font-weight:700; letter-spacing:.14em; color:var(--ink); display:flex; align-items:center; gap:9px; }
  h1 svg { width:26px; height:26px; }
  .dir { display:flex; align-items:center; gap:10px; }
  #quando { font-size:12px; color:var(--soft); display:flex; align-items:center; gap:6px; background:none; border:0; padding:6px 2px; min-height:32px; }
  #quando i { width:7px; height:7px; border-radius:50%; background:var(--mint); box-shadow:0 0 0 0 rgba(147,233,186,.6); animation:vivo 2.4s infinite; }
  #quando.old { color:var(--gold); } #quando.old i { background:var(--gold); animation:none; }
  @keyframes vivo { 0% { box-shadow:0 0 0 0 rgba(147,233,186,.55) } 70%,100% { box-shadow:0 0 0 7px rgba(147,233,186,0) } }
  #cfg { background:rgba(255,255,255,.04); border:1px solid #3a5558; color:var(--soft); border-radius:999px; font-size:12px; font-weight:600; padding:0 12px; min-height:34px; transition:background .2s,border-color .2s,transform .15s; }
  #cfg.ok { color:var(--mint); border-color:rgba(147,233,186,.55); }
  #cfg:active { transform:scale(.95); }
  #aviso { background:#3a3320; color:var(--gold); border-radius:14px; padding:10px 14px; font-size:13px; margin-bottom:12px; display:none; }

  /* cartões */
  .card { background:linear-gradient(180deg,#243c3f,#1f3336); border:1px solid var(--linha); border-radius:22px; padding:16px 18px; margin-bottom:12px; box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px rgba(0,0,0,.18); }
  .card small, .rot { display:block; color:var(--soft); font-size:12px; font-weight:500; letter-spacing:.02em; margin-bottom:5px; }
  .big { font-size:34px; font-weight:700; line-height:1.1; letter-spacing:-.02em; }
  .titulo { font-size:23px; font-weight:700; line-height:1.2; letter-spacing:-.01em; }
  .sub { color:var(--soft); font-size:13px; margin-top:6px; white-space:pre-line; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .grid .card { margin:0; padding:14px 16px; } .grid .big { font-size:22px; }
  .ok { color:var(--mint); } .warn { color:var(--gold); } .bad { color:var(--red); } .blue { color:var(--blue); }
  .linha { color:var(--soft); font-size:14px; margin-top:10px; white-space:pre-line; }
  h2 { font-size:11px; font-weight:700; color:var(--soft); letter-spacing:.12em; text-transform:uppercase; margin:20px 4px 10px; }
  .texto { white-space:pre-line; font-size:15px; }
  .chip { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,.06); color:var(--soft); }
  .chip i { width:8px; height:8px; border-radius:50%; background:#6c7f7c; }
  .chip.on { color:var(--mint); background:rgba(147,233,186,.12); } .chip.on i { background:var(--mint); box-shadow:0 0 8px var(--mint); }
  .topo-card { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; }

  /* progresso */
  .prog { margin-top:16px; }
  .prog .l1 { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .prog .pct { font-size:26px; font-weight:700; letter-spacing:-.02em; }
  .prog .qtd { color:var(--soft); font-size:13px; }
  .barra { position:relative; height:12px; background:rgba(0,0,0,.32); border-radius:999px; overflow:hidden; margin-top:10px; box-shadow:0 1px 0 rgba(255,255,255,.05); }
  .barra i { position:absolute; inset:0 auto 0 0; width:0; border-radius:inherit; background:linear-gradient(90deg,#5fd39a,var(--mint)); transition:width 1.1s var(--suave); }
  .barra.ativo i::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent); transform:translateX(-100%); animation:brilho 2.2s infinite; }
  .barra.alerta i { background:linear-gradient(90deg,#d9a24a,var(--gold)); }
  .barra.semtrans i { transition:none; }
  @keyframes brilho { to { transform:translateX(100%) } }
  .pcs { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; align-items:center; }
  .pcs .qtd { color:var(--soft); font-size:13px; margin-left:auto; }

  /* seletor de moeda */
  .seg { position:relative; display:grid; grid-template-columns:1fr 1fr; background:var(--bg2); border:1px solid var(--linha); border-radius:16px; padding:4px; margin-bottom:12px; --p:0; }
  .seg .thumb { position:absolute; top:4px; bottom:4px; left:4px; width:calc(50% - 4px); border-radius:12px; background:var(--tile2); box-shadow:0 2px 10px rgba(0,0,0,.35); transform:translateX(calc(var(--p)*100%)); transition:transform .42s var(--mola); }
  .seg button { position:relative; background:none; border:0; min-height:42px; border-radius:12px; font-size:14px; font-weight:600; color:var(--soft); transition:color .25s; }
  .seg button.on { color:var(--ink); }

  /* botões */
  .acoes { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  .btn { min-height:46px; padding:0 18px; border-radius:14px; border:1px solid rgba(147,233,186,.6); background:none; color:var(--mint); font-size:14px; font-weight:600; transition:transform .15s,background .2s,opacity .2s; }
  .btn.cheio { background:var(--mint); color:#102019; border-color:var(--mint); }
  .btn.perigo { border-color:rgba(255,138,122,.7); color:var(--red); }
  .btn.cinza { border-color:#3f5a5d; color:var(--soft); }
  .btn:disabled { opacity:.38; }
  .btn:active:not(:disabled) { transform:scale(.96); }
  .btn:focus-visible, #cfg:focus-visible, input:focus-visible, .tab:focus-visible, .seg button:focus-visible, .item:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }

  /* histórico por mês */
  .mes { display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:14px; padding-top:12px; }
  .mes:first-child { padding-top:0; } .mes b { white-space:nowrap; font-weight:600; } .mes span { color:var(--soft); font-size:13px; }
  .mbar { height:6px; background:rgba(0,0,0,.3); border-radius:99px; overflow:hidden; margin:7px 0 2px; }
  .mbar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#5fd39a,var(--mint)); border-radius:inherit; transition:width 1s var(--suave); }

  /* fator de saúde */
  .hf { position:relative; height:8px; border-radius:99px; margin-top:14px; background:linear-gradient(90deg,var(--red) 0 25%,var(--gold) 25% 50%,var(--mint) 50% 100%); opacity:.9; }
  .hf i { position:absolute; top:-4px; width:4px; height:16px; border-radius:3px; background:#fff; box-shadow:0 0 0 3px rgba(0,0,0,.35); transform:translateX(-50%); transition:left 1s var(--suave); }

  /* avisos */
  .abas { display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--bg2); border-radius:16px; padding:4px; margin-bottom:14px; }
  .abas button { background:none; border:0; color:var(--soft); border-radius:12px; min-height:42px; font-size:14px; font-weight:600; transition:background .25s,color .25s; }
  .abas button.on { background:var(--tile2); color:var(--ink); }
  .item { position:relative; background:linear-gradient(180deg,#243c3f,#1f3336); border:1px solid var(--linha); border-radius:18px; padding:13px 16px 13px 20px; margin-bottom:10px; cursor:pointer; transition:transform .15s; overflow:hidden; }
  .item:active { transform:scale(.985); }
  .item::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--cor,var(--blue)); }
  .item[data-o=Trading] { --cor:var(--mint); } .item[data-o=Garimpo] { --cor:var(--gold); }
  .item .meta { font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--cor,var(--blue)); text-transform:uppercase; }
  .item .t { font-weight:600; margin-top:3px; } .item.lida .t { font-weight:400; color:var(--soft); }
  .item .novo { position:absolute; right:14px; top:50%; width:9px; height:9px; margin-top:-4.5px; border-radius:50%; background:var(--blue); box-shadow:0 0 10px var(--blue); }
  .dia { font-size:12px; font-weight:600; color:var(--soft); margin:18px 4px 8px; }
  .voltar { display:inline-flex; align-items:center; gap:4px; background:none; border:0; color:var(--mint); font-size:15px; font-weight:600; min-height:44px; padding:0 8px 0 0; }
  .voltar svg { width:20px; height:20px; }
  .vazio { text-align:center; color:var(--soft); margin-top:32px; font-size:14px; }

  /* esqueleto */
  .sk { height:96px; border-radius:22px; margin-bottom:12px; background:linear-gradient(100deg,#1f3336 30%,#2a4346 50%,#1f3336 70%); background-size:200% 100%; animation:esq 1.3s infinite linear; }
  @keyframes esq { to { background-position:-200% 0 } }

  /* transição de tela */
  #tela.d > *, #tela.e > * { animation:surge .55s var(--suave) both; animation-delay:calc(var(--i,0)*55ms); }
  #tela.d { --dx:32px; } #tela.e { --dx:-32px; }
  @keyframes surge { from { opacity:0; transform:translate3d(var(--dx),12px,0) scale(.985) } to { opacity:1; transform:none } }
  #tela.f > * { animation:fundir .28s ease both; animation-delay:calc(var(--i,0)*25ms); }
  @keyframes fundir { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }

  /* dock (igual ao do PC) */
  nav { position:fixed; left:50%; bottom:max(16px,env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:6; display:flex; padding:6px; border-radius:32px; --idx:0; --tw:min(92px,calc((100vw - 44px) / 5));
    background:linear-gradient(180deg,#14282b,#0f1c1e); border:1px solid #2c4548; box-shadow:0 14px 34px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.05) inset; }
  nav .foco { position:absolute; left:6px; top:6px; width:var(--tw); height:60px; border-radius:26px; background:var(--tile); box-shadow:0 0 0 1px rgba(255,255,255,.05) inset; transform:translateX(calc(var(--idx)*100%)); transition:transform .5s var(--mola); }
  .tab { position:relative; width:var(--tw); height:60px; background:none; border:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--soft); font-size:11px; font-weight:600; letter-spacing:.02em; transition:color .3s,transform .15s; }
  .tab:active { transform:scale(.93); }
  .tab svg { width:34px; height:34px; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; opacity:.62; transition:opacity .3s,transform .4s var(--mola); }
  .tab[data-aba=fabrica] { --c:var(--mint); } .tab[data-aba=garimpo] { --c:var(--gold); } .tab[data-aba=avisos] { --c:var(--blue); }
  .tab svg { color:var(--c); }
  .tab.on { color:var(--ink); } .tab.on svg { opacity:1; transform:translateY(-1px) scale(1.06); }
  .tab .n { position:absolute; top:5px; left:calc(50% + 8px); background:var(--blue); color:#102019; border-radius:10px; font-size:11px; font-weight:800; padding:1px 6px; min-width:18px; text-align:center; animation:pop .4s var(--mola); }
  @keyframes pop { from { transform:scale(0) } to { transform:none } }
  .pica, .sino { transform-box:view-box; } .pica { transform-origin:27px 30px; } .sino { transform-origin:27px 13px; }
  .b { transform-box:fill-box; transform-origin:50% 100%; }
  .tab.tocar .b { animation:sobe .6s var(--mola) both; animation-delay:calc(var(--k)*70ms); }
  .tab.tocar .pica { animation:balanca .7s ease-out; } .tab.tocar .sino { animation:toca .8s ease-out; }
  @keyframes sobe { from { transform:scaleY(.1) } to { transform:none } }
  @keyframes balanca { 0% { transform:rotate(0) } 30% { transform:rotate(-26deg) } 65% { transform:rotate(14deg) } 100% { transform:none } }
  @keyframes toca { 0%,100% { transform:rotate(0) } 15% { transform:rotate(15deg) } 35% { transform:rotate(-12deg) } 55% { transform:rotate(8deg) } 75% { transform:rotate(-3deg) } }

  /* abas novas (24/11/2026): Timoneiro (violeta, leme que gira) e Engenheiros (rosa, lâmpada que acende) */
  .tab[data-aba=timoneiro] { --c:var(--violet); } .tab[data-aba=engenheiros] { --c:var(--rose); }
  .leme, .lamp { transform-box:view-box; } .leme { transform-origin:27px 26px; } .lamp { transform-origin:27px 24px; }
  .raio { opacity:0; }
  .tab.tocar .leme { animation:leme .9s var(--mola); } .tab.tocar .lamp { animation:lamp .7s ease-out; } .tab.tocar .raio { animation:raio .8s ease-out; }
  @keyframes leme { 0% { transform:rotate(0) } 65% { transform:rotate(200deg) } 100% { transform:rotate(180deg) } }
  @keyframes lamp { 0%,100% { transform:none } 30% { transform:scale(1.12) } 60% { transform:scale(.97) } }
  @keyframes raio { 0% { opacity:0 } 30%,60% { opacity:1 } 100% { opacity:0 } }
  .tab .n.eng { background:var(--rose); }
  @media (max-width:420px) { .tab { font-size:10px; letter-spacing:0; } .tab svg { width:30px; height:30px; } }
  .item[data-o=Timoneiro] { --cor:var(--violet); }
  .chip.alerta { color:var(--gold); background:rgba(255,204,121,.12); } .chip.alerta i { background:var(--gold); }

  /* ranking do Garimpo: uma linha por pool, barra fina do APY (uma série, sem legenda: o título do cartão diz o que é) */
  .rk { display:grid; grid-template-columns:28px 1fr auto; align-items:center; gap:4px 10px; padding:12px 0 10px; border-top:1px solid var(--linha); }
  .rk:first-of-type { border-top:0; padding-top:4px; }
  .rk .pos { width:26px; height:26px; border-radius:50%; background:rgba(255,204,121,.12); color:var(--gold); font-size:12px; font-weight:700; display:grid; place-items:center; }
  .rk b { font-weight:600; font-size:15px; } .rk .sub { margin-top:2px; font-size:12px; }
  .rk .apy { text-align:right; font-size:18px; font-weight:700; } .rk .apy .rot { margin:0; font-size:11px; }
  .rk .mbar { grid-column:2 / 4; margin:2px 0 0; height:5px; } .rk .mbar i { background:linear-gradient(90deg,#d9a24a,var(--gold)); }

  /* modo das taxas do Timoneiro: três opções, a atual marcada */
  .opc { display:flex; align-items:center; gap:12px; width:100%; text-align:left; min-height:56px; padding:10px 14px; margin-top:8px; border-radius:14px; border:1px solid #3a5558; background:rgba(0,0,0,.14); font-size:14px; font-weight:600; transition:border-color .25s,background .25s,transform .15s,opacity .2s; }
  .opc i { width:18px; height:18px; border-radius:50%; border:2px solid #6c7f7c; flex:none; transition:border-color .25s,box-shadow .35s var(--mola); }
  .opc small { display:block; color:var(--soft); font-weight:500; font-size:12px; margin-top:2px; }
  .opc.on { border-color:rgba(185,163,255,.7); background:rgba(185,163,255,.10); } .opc.on i { border-color:var(--violet); box-shadow:inset 0 0 0 3px #1f3336,inset 0 0 0 9px var(--violet); }
  .opc:disabled { opacity:.45; } .opc:active:not(:disabled) { transform:scale(.98); } .opc:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }

  /* folha de confirmação */
  .veu { position:fixed; inset:0; background:rgba(5,12,13,.66); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); display:flex; align-items:flex-end; z-index:20; opacity:0; visibility:hidden; transition:opacity .25s,visibility 0s .45s; }
  .veu.on { opacity:1; visibility:visible; transition:opacity .25s; }
  .folha { width:100%; background:linear-gradient(180deg,#223a3d,#1a2e31); border-radius:28px 28px 0 0; padding:10px 20px calc(20px + env(safe-area-inset-bottom)); max-height:88dvh; overflow:auto; border-top:1px solid rgba(255,255,255,.08);
    transform:translateY(100%); transition:transform .45s var(--suave); }
  .veu.on .folha { transform:none; }
  .alca { display:block; width:40px; height:5px; border-radius:9px; background:rgba(255,255,255,.2); margin:0 auto 16px; }
  .folha h3 { font-size:20px; font-weight:700; margin-bottom:10px; letter-spacing:-.01em; }
  .folha .aviso { background:rgba(255,204,121,.12); color:var(--gold); border-radius:12px; padding:11px 13px; font-size:13px; margin:12px 0; }
  .folha .estado { margin-top:14px; font-size:15px; white-space:pre-line; }
  .folha input { width:100%; min-height:50px; background:var(--bg2); border:1px solid #3f5a5d; border-radius:14px; color:var(--ink); font:inherit; font-size:16px; padding:0 14px; margin-top:12px; letter-spacing:.06em; }

  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
<header>
  <h1><svg viewBox="0 0 54 54" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="1" width="52" height="52" rx="14" fill="#213538"/><path d="M14 36V30M20 36V24M26 36V28M32 36V18" stroke="#93e9ba" stroke-width="3"/><path d="M36 38L44 26" stroke="#ffcc79" stroke-width="3"/></svg>BILBAO</h1>
  <span class="dir"><button id="quando" type="button" aria-label="Atualizar agora"><i></i><span>Conectando…</span></button><button id="cfg" type="button">Controle</button></span>
</header>
<div id="aviso" role="status"></div>

<div class="veu" id="veu"><div class="folha" role="dialog" aria-modal="true" aria-labelledby="ftitulo"><i class="alca"></i><h3 id="ftitulo"></h3><div id="fcorpo"></div><div class="estado" id="festado" role="status" aria-live="polite"></div><div class="acoes" id="fbotoes"></div></div></div>
<script>
// Mesma configuração do Tracker (localStorage sb_url / sb_key). Nada de chave no código: o repositório é público.
let URL_ = localStorage.getItem('sb_url') || '', KEY = localStorage.getItem('sb_key') || '';
if (!URL_ || !KEY) {
  URL_ = (prompt('Cole a URL do Supabase (a mesma do Tracker):') || '').trim().replace(/\/$/, '');
  KEY = (prompt('Cole a chave anon do Supabase (a mesma do Tracker):') || '').trim();
  if (URL_ && KEY) { localStorage.setItem('sb_url', URL_); localStorage.setItem('sb_key', KEY); }
}
const $ = s => document.querySelector(s);
const fmt = v => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
const vibra = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
// h('div', {class:'x'}, 'texto', filho...) monta DOM sem innerHTML: o texto das notificações nunca vira HTML.
function h(tag, attrs, ...filhos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) k === 'onclick' ? e.onclick = v : e.setAttribute(k, v);
  for (const f of filhos.flat()) if (f != null && f !== false) e.append(f.nodeType ? f : document.createTextNode(f));
  return e;
}
// Número que "sobe" de 0 ao valor quando a tela entra (some com "reduzir movimento").
const num = (v, f) => { const s = h('span', { class: 'num' }, f(v)); s._v = v; s._f = f; return s; };
function contar() {
  if (reduz) return;
  document.querySelectorAll('#tela .num').forEach(s => {
    const t0 = performance.now(), D = 850;
    const passo = t => { const k = Math.min(1, (t - t0) / D); s.textContent = s._f(s._v * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(passo); };
    requestAnimationFrame(passo);
  });
}
const card = (rotulo, valor, sub, cls) => h('div', { class: 'card' }, h('small', {}, rotulo), h('div', { class: 'big ' + (cls || '') }, valor), sub ? h('div', { class: 'sub' }, sub) : null);

const ORDEM = ['fabrica', 'garimpo', 'timoneiro', 'engenheiros', 'avisos'];
let E = null, aba = localStorage.getItem('bilbao_aba') || 'fabrica', aberta = null, verLidas = false, animando = false;
const cacheBilbao = 'bilbao_ultima_leitura:' + URL_;
try { E = JSON.parse(localStorage.getItem(cacheBilbao) || 'null'); } catch {}   // sobrevive a fechar o app: com o Supabase fora, ainda mostra a última leitura
let carregando = false, conexaoOk = false;
if (!ORDEM.includes(aba)) aba = 'fabrica';
let moeda = localStorage.getItem('bilbao_moeda') === 'USD' ? 'USD' : 'BRL', moedaAnt = moeda;
let lidas = new Set(JSON.parse(localStorage.getItem('bilbao_lidas') || 'null') || []);
const salvarLidas = () => localStorage.setItem('bilbao_lidas', JSON.stringify([...lidas]));

// ---------- Controle: comandos assinados para o PC (bilbao_comandos.py) ----------
const pcOk = () => conexaoOk && !!E && E.controle_disponivel !== false && (Date.now() - Date.parse(E.em)) / 60000 < 3;
const seg = () => localStorage.getItem('bilbao_seg') || '';
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
async function assinar(nonce, acao, alvo) {   // HMAC-SHA256 hex de "nonce|acao|alvo", igual ao PC
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(seg()), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return hex(await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(`${nonce}|${acao}|${alvo}`)));
}
const cab = () => ({ apikey: KEY, Authorization: 'Bearer ' + KEY });
async function lerChave(chave) {
  const controle = new AbortController(), limite = setTimeout(() => controle.abort(), 12000);
  try {
    const r = await fetch(URL_ + '/rest/v1/tracker_data?select=value&key=eq.' + chave, { headers: cab(), cache: 'no-store', signal: controle.signal });
    if (!r.ok) throw new Error('Supabase ' + r.status);
    return ((await r.json())[0] || {}).value;
  } finally {
    clearTimeout(limite);
  }
}
async function gravarChave(chave, value) {
  const r = await fetch(URL_ + '/rest/v1/tracker_data?on_conflict=key', { method: 'POST', body: JSON.stringify({ key: chave, value }),
    headers: { ...cab(), 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' } });
  if (!r.ok) throw new Error('Supabase ' + r.status);
}
const espera = ms => new Promise(r => setTimeout(r, ms));

let folhaOcupada = false, folhaFoco = null;
function folha(titulo, corpo, botoes, estado) {
  $('#ftitulo').textContent = titulo;
  $('#fcorpo').replaceChildren(...[].concat(corpo || []));
  $('#festado').textContent = estado || '';
  $('#fbotoes').replaceChildren(...botoes);
  if (!$('#veu').classList.contains('on')) folhaFoco = document.activeElement;
  $('#veu').classList.add('on');
  ($('#fcorpo input') || $('#fbotoes .cheio, #fbotoes button'))?.focus({ preventScroll: true });
}
function fechar() { if (folhaOcupada) return; $('#veu').classList.remove('on'); folhaFoco?.focus?.({ preventScroll: true }); }
$('#veu').onclick = e => { if (e.target === $('#veu')) fechar(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });
const fecharBtn = (rotulo = 'Fechar') => h('button', { class: 'btn cinza', onclick: fechar }, rotulo);

// Pede confirmação (folha inferior), assina e envia o comando, acompanha o resultado.
function comandar({ acao, alvo = '', titulo, texto, aviso, rotulo = 'Confirmar', perigo = false, direto = false }) {
  if (!seg()) return pareamento('Pareie o celular primeiro: a senha é mostrada no PC (python bilbao_comandos.py parear).');
  if (!pcOk()) return folha('Controle indisponível', h('div', { class: 'sub' }, 'Abra o Bilbao no PC e aguarde a próxima atualização para enviar comandos.'), [fecharBtn()]);
  const corpo = [texto ? h('div', { class: 'texto' }, texto) : null, aviso ? h('div', { class: 'aviso' }, aviso) : null];
  const go = () => { vibra(10); enviar(acao, alvo, titulo); };
  if (direto) return go();
  folha(titulo, corpo, [h('button', { class: 'btn ' + (perigo ? 'perigo' : 'cheio'), onclick: go }, rotulo), fecharBtn('Cancelar')]);
}
async function enviar(acao, alvo, titulo) {
  folhaOcupada = true;
  const fim = (txt, cls) => { folhaOcupada = false; folha(titulo, [], [fecharBtn()], txt); $('#festado').className = 'estado ' + (cls || ''); setTimeout(carregar, 2500); };
  folha(titulo, [], [h('button', { class: 'btn cinza', disabled: '' }, 'Enviando…')], 'Enviando ao PC…');
  try {
    const ctl = await lerChave('bilbao_ctl');
    if (!ctl || !ctl.nonce) return fim('O Bilbao do PC ainda não publicou o desafio de segurança. Ele está aberto?', 'warn');
    const id = hex(crypto.getRandomValues(new Uint8Array(12)));
    await gravarChave('bilbao_cmd', { id, acao, alvo, nonce: ctl.nonce, mac: await assinar(ctl.nonce, acao, alvo), em: new Date().toISOString() });
    let visto = false;
    for (let i = 0; i < 30; i++) {
      await espera(1500);
      const r = ((await lerChave('bilbao_ctl')) || {}).resultado;
      if (!r || r.id !== id) { $('#festado').textContent = 'Aguardando o PC…'; continue; }
      visto = true;
      if (r.estado === 'executando') { $('#festado').textContent = r.texto || 'Executando…'; continue; }
      return fim(r.texto || 'Feito.', r.estado === 'ok' ? 'ok' : 'bad');
    }
    fim(visto ? 'Ainda em andamento no PC. Acompanhe pelos cartões; o resultado aparece aqui na próxima vez que você pedir.' : 'O PC não respondeu em 45 s. O comando perde a validade quando o Bilbao reinicia.', 'warn');
  } catch (e) { fim('Falha de conexão: ' + e.message, 'bad'); }
}
function pareamento(msg) {
  const inp = h('input', { type: 'text', autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', placeholder: 'XXXX-XXXX-XXXX-…', 'aria-label': 'Senha de pareamento' });
  const corpo = [h('div', { class: 'texto' }, msg || (seg() ? 'Este celular está pareado. Cole uma senha nova para trocar.' : 'Digite a senha de pareamento mostrada no PC (python bilbao_comandos.py parear). Ela fica só neste aparelho.')), inp];
  folha('Controle do Bilbao', corpo, [
    h('button', { class: 'btn cheio', onclick: () => {
      const s = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (s.length !== 28) return ($('#festado').textContent = 'A senha tem 28 letras e números.');
      localStorage.setItem('bilbao_seg', s); marcarCfg(); desenhar(); fechar();
    } }, 'Salvar'),
    seg() ? h('button', { class: 'btn perigo', onclick: () => { localStorage.removeItem('bilbao_seg'); marcarCfg(); desenhar(); fechar(); } }, 'Esquecer') : null, fecharBtn('Cancelar')].filter(Boolean));
}
function marcarCfg() { $('#cfg').classList.toggle('ok', !!seg()); $('#cfg').textContent = seg() ? 'Controle ✓' : 'Controle'; }
$('#cfg').onclick = () => pareamento();
const AVISO_CLAUDE = 'Abre o Claude Code no PC, que passa a mexer em arquivos do projeto.';
const botao = (rotulo, cls, fn) => { const a = { class: 'btn ' + cls, onclick: fn }; if (!pcOk()) a.disabled = ''; return h('button', a, rotulo); };

// ---------- telas ----------
function barra(done, total, cls) {
  const pct = total ? Math.min(100, 100 * done / total) : 0;
  const i = h('i', {});
  const b = h('div', { class: 'barra ' + (cls || '') + (animando ? '' : ' semtrans'), role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(Math.round(pct)) }, i);
  if (animando) requestAnimationFrame(() => requestAnimationFrame(() => { i.style.width = pct + '%'; })); else i.style.width = pct + '%';
  return { b, pct };
}
const pctTxt = p => (p > 0 && p < 10 ? p.toFixed(1) : Math.round(p)).toString().replace('.', ',') + '%';
const inteiro = v => Math.round(v).toLocaleString('pt-BR');

function fabrica() {
  const t = E.trading || {}, p = t.progresso, pcs = t.pcs;
  const cls = t.cor === 'ativo' ? 'ok' : t.cor === 'alerta' ? 'warn' : '';
  const corpo = [h('div', { class: 'topo-card' }, h('small', { style: 'margin:0' }, 'Fábrica · mesa de trading')), h('div', { class: 'titulo ' + cls }, t.estado || '—')];
  if (p) {
    const { b, pct } = barra(p[0], p[1], t.cor);
    corpo.push(h('div', { class: 'prog' },
      h('div', { class: 'l1' }, h('span', { class: 'qtd' }, `${inteiro(p[0])} de ${inteiro(p[1])} ${p[2]}`), h('span', { class: 'pct ' + cls }, num(pct, pctTxt))), b));
  }
  if (pcs) {
    const roda = s => s === 'rodando', n = [pcs.notebook, pcs.segundo].filter(roda).length;
    corpo.push(h('div', { class: 'pcs' },
      h('span', { class: 'chip' + (roda(pcs.notebook) ? ' on' : '') }, h('i', {}), 'Notebook · ' + pcs.notebook + (pcs.tarefa && roda(pcs.notebook) ? ' (' + pcs.tarefa + ')' : '')),
      h('span', { class: 'chip' + (roda(pcs.segundo) ? ' on' : '') }, h('i', {}), 'Segundo PC · ' + pcs.segundo + (pcs.tarefa && roda(pcs.segundo) ? ' (' + pcs.tarefa + ')' : '')),
      h('span', { class: 'qtd' }, `${n} de 2 PCs rodando`)));
  }
  (t.linhas || []).filter(l => !(pcs && /^Notebook ·/.test(l))).forEach(l => corpo.push(h('div', { class: 'linha' }, l)));
  if (t.bloco) corpo.push(h('div', { class: 'acoes' },
    botao('Parar mineração', 'perigo', () => comandar({ acao: 'mineracao.parar', titulo: 'Parar a mineração?', texto: 'Pede à Máquina que pare nos dois PCs. Cada um termina a candidata em andamento.', rotulo: 'Parar', perigo: true })),
    botao('Continuar mineração', 'cheio', () => comandar({ acao: 'mineracao.continuar', titulo: 'Continuar a mineração?', texto: 'Pede à Máquina que retome a mineração nos dois PCs.', rotulo: 'Continuar' }))));
  return [h('div', { class: 'card' }, corpo)];   // as decisões do Engenheiro ficam na aba Engenheiros
}

// Moeda: o PC manda USD e BRL; o seletor só escolhe qual mostrar.
const din = (usd, brl) => moeda === 'USD' ? (usd != null ? 'US$ ' + fmt(usd) : '—') : (brl != null ? 'R$ ' + fmt(brl) : '—');
const dinNum = (usd, brl) => { const v = moeda === 'USD' ? usd : brl; const f = x => (moeda === 'USD' ? 'US$ ' : 'R$ ') + fmt(x); return v != null ? num(v, f) : '—'; };

function seletorMoeda() {
  const p0 = moedaAnt === 'USD' ? 1 : 0, p1 = moeda === 'USD' ? 1 : 0;
  const w = h('div', { class: 'seg', role: 'group', 'aria-label': 'Moeda' }, h('i', { class: 'thumb' }),
    [['BRL', 'R$  Real'], ['USD', 'US$  Dólar']].map(([m, r]) => h('button', { type: 'button', class: moeda === m ? 'on' : '', 'aria-pressed': String(moeda === m), onclick: () => {
      if (moeda === m) return; moedaAnt = moeda; moeda = m; localStorage.setItem('bilbao_moeda', m); vibra(8); desenhar('f'); } }, r)));
  w.style.setProperty('--p', p0);
  requestAnimationFrame(() => requestAnimationFrame(() => w.style.setProperty('--p', p1)));
  moedaAnt = moeda;
  return w;
}

// Timoneiro: prévia das 7h00 (chave timoneiro_previa, gravada pelo motor no PC), com Cancelar por posição até o plano das 7h15.
let TIM = null;
const n6 = x => typeof x === 'number' ? x.toLocaleString('pt-BR', { maximumSignificantDigits: 6 }) : '—';
function timoneiro() {
  const t = TIM, hojeBR = new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);
  if (!t || t.plano_id !== hojeBR) return [];
  const ref = (t.posicoes || []).filter(p => p.acao === 'refazer'), canc = new Set(t.cancelados || []), aberto = t.estado === 'previa' && !t.pausado;
  const sub = t.pausado ? (t.pausa_so_hoje ? 'Pausado hoje: ' + (t.motivo_pausa || '') + '. Volta sozinho amanhã.' : 'Pausado: ' + (t.motivo_pausa || 'perda acima do limite') + '. Libera só no PC.')
    : t.estado === 'plano_gerado' ? 'Plano das 7h15 gerado; o executor segue daqui.'
    : t.estado === 'sem_canal' ? 'Sem canal do Cancelar às 7h15: hoje o robô não executa.'
    : ref.length ? 'Cancele o que não quiser até 7h15.' : 'Nada a fazer hoje.';
  const f = [h('h2', {}, 'Prévia de hoje'), h('div', { class: 'card' }, h('small', {}, 'Prévia das 7h00'),
    h('div', { class: 'titulo' }, ref.length ? ref.length + (ref.length > 1 ? ' ajustes' : ' ajuste') : 'Nenhum ajuste'), h('div', { class: 'sub' }, sub))];
  ref.forEach(p => {
    const fx = p.faixa_sugerida, cancelado = canc.has(p.passo_id);
    f.push(h('div', { class: 'card' }, h('small', {}, (p.ritmo === 'semanal' ? 'Semanal' : 'Diária') + ' · US$ ' + fmt(p.valor_usd || 0)),
      h('div', { class: 'texto' }, p.par + ': ' + p.motivo),
      fx ? h('div', { class: 'sub' }, `Faixa sugerida: ${n6(fx.min)} – ${n6(fx.max)} (${fx.regra}). Preço final às 7h15.`) : null,
      cancelado ? h('div', { class: 'sub' }, 'Cancelado: o robô não mexe nesta posição hoje.')
        : aberto ? h('div', { class: 'acoes' }, botao('Cancelar ajuste', 'perigo', () => comandar({ acao: 'cancelar_ajuste', alvo: p.passo_id, titulo: 'Cancelar este ajuste?',
            texto: p.par + ': o robô não refaz esta posição hoje.', rotulo: 'Cancelar ajuste', perigo: true }))) : null));
  });
  return f;
}
// ---------- Garimpo (24/11/2026): só o estado da coleta e as 5 melhores do Ranking ----------
const linhaPool = p => [p.rede === 'bsc' ? 'BSC' : String(p.rede || '').replace(/^./, c => c.toUpperCase()),
  typeof p.taxa === 'number' ? (p.taxa * 100).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + '%' : null,
  typeof p.tvl === 'number' ? 'TVL US$ ' + (p.tvl / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' mi' : null].filter(Boolean).join(' · ');
const dataHora = iso => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
function garimpo() {
  const g = E.garimpo || {}, rk = g.ranking, ativo = g.cor === 'ativo';
  const f = [h('div', { class: 'card' }, h('div', { class: 'topo-card' }, h('small', { style: 'margin:0' }, 'Coleta do Garimpo'),
      h('span', { class: 'chip' + (ativo ? ' on' : '') }, h('i', {}), ativo ? 'Coletando' : g.coleta_concluida ? 'Concluída' : 'Em espera')),
    h('div', { class: 'titulo' + (ativo ? ' ok' : '') }, g.estado || '—'))];
  f.push(h('h2', {}, 'Ranking · 5 melhores'));
  const pools = (rk && rk.pools) || [];
  if (!pools.length) return [...f, h('div', { class: 'card' }, h('div', { class: 'sub', style: 'margin:0' }, 'Ranking indisponível nesta leitura.'))];
  const max = Math.max(...pools.map(p => p.apy), 1);
  f.push(h('div', { class: 'card' }, h('small', {}, 'Pools grandes · ritmo diário · APY teste'), pools.map((p, i) => {
    const w = Math.max(2, Math.round(100 * p.apy / max)), bar = h('i', {});
    if (animando) requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = w + '%'; })); else { bar.style.transition = 'none'; bar.style.width = w + '%'; }
    return h('div', { class: 'rk' }, h('span', { class: 'pos', 'aria-label': (i + 1) + 'º' }, String(i + 1)),
      h('div', {}, h('b', {}, p.par), h('div', { class: 'sub' }, linhaPool(p))),
      h('div', { class: 'apy' }, num(p.apy, v => inteiro(v) + '%'), h('small', { class: 'rot' }, 'APY teste')),
      h('div', { class: 'mbar', 'aria-hidden': 'true' }, bar));
  }), rk.em ? h('div', { class: 'sub', style: 'margin-top:12px' }, 'Da coleta de ' + dataHora(rk.em)) : null));
  return f;
}

// ---------- Timoneiro (24/11/2026): robô + métricas da carteira (vieram do Garimpo) ----------
const MODOS = [['reinvestir', 'Reinvestir tudo', 'As taxas voltam para a posição.'],
  ['so_principal', 'Reinvestir só o principal', 'Só o principal volta para a posição.'],
  ['enviar_taxas', 'Enviar as taxas', 'Vão para a EVM principal (endereço fixo no PC).']];
function cardT24(tx) {   // parcial: mostra o que foi lido e quantas posições (≈ R$ 53,34 · 14 de 19 posições)
  if (!tx || tx.pools == null) return card('Taxas · 24 h', '—', 'Aguardando leitura');
  if (!tx.lidas || tx.taxas_usd == null) return card('Taxas · 24 h', '—', `0 de ${tx.pools} posições lidas`);
  const parcial = tx.lidas !== tx.pools;
  return card('Taxas · 24 h', [parcial || tx.estimada ? '≈ ' : '', dinNum(tx.taxas_usd, tx.taxas_brl)],
    parcial ? `${tx.lidas} de ${tx.pools} posições` : `${tx.lidas} de ${tx.pools} posições lidas` + (tx.estimada ? ' · inclui estimativa' : ''), 'ok');
}
function timoneiroAba() {
  const tm = E.timoneiro || {}, m = tm.metricas || (E.garimpo || {}).metricas || {}, hf = m.hf, tx = E.taxas, mes = tx && tx.mes, fx = m.fx;
  const sit = tm.situacao, ref = tm.refeitas, cls = tm.cor === 'alerta' ? 'warn' : tm.cor === 'ativo' ? 'ok' : '';
  const f = [seletorMoeda(), h('div', { class: 'card' },
    h('small', {}, 'Robô da carteira de teste'),
    h('div', { class: 'titulo ' + cls }, tm.estado || 'Sem dados do robô'),
    tm.motivo_pausa ? h('div', { class: 'sub' }, tm.motivo_pausa) : null,
    (tm.linhas || []).map(l => h('div', { class: 'sub' }, l)),
    sit && sit !== 'sem_carteira' ? h('div', { class: 'acoes' }, sit === 'parado'
      ? botao('Continuar', 'cheio', () => comandar({ acao: 'timoneiro_continuar', titulo: 'Continuar o Timoneiro?', texto: 'Desfaz só o Parar: o robô volta a ajustar a partir da próxima prévia.', aviso: 'Pausa por perda e parada por falha continuam até a liberação no PC.', rotulo: 'Continuar' }))
      : botao('Parar', 'perigo', () => comandar({ acao: 'timoneiro_parar', titulo: 'Parar o Timoneiro?', texto: 'Pausa os próximos ajustes e para o executor na hora.', aviso: 'Uma ordem CoW já aberta ainda pode ser liquidada depois do Parar.', rotulo: 'Parar', perigo: true }))) : null)];
  const saldoOk = typeof m.saldo_usd === 'number' && fx, pendOk = typeof m.pend_usd === 'number' && fx;
  f.push(h('div', { class: 'card' }, h('small', {}, 'Saldo total'), h('div', { class: 'big' }, saldoOk ? dinNum(m.saldo_usd, m.saldo_usd * fx) : (m.saldo || '—'))));
  f.push(h('div', { class: 'grid' },
    card('Taxas a recolher', pendOk ? dinNum(m.pend_usd, m.pend_usd * fx) : (m.taxas || '—'), null, 'ok'),
    cardT24(tx),
    card('Para recalibrar', String(m.fora ?? '—'), null, m.fora > 0 ? 'warn' : ''),
    card('Dentro da faixa', String(m.dentro ?? '—')),
    card('Pools automatizadas', tm.automatizadas != null ? num(tm.automatizadas, inteiro) : '—', 'Na carteira de teste'),
    card('Pools refeitas', ref ? num(ref.hoje || 0, inteiro) : '—', ref ? `hoje · ${inteiro(ref.total || 0)} no total` : null)));
  if (hf) {
    const c = hf.valor < 1.5 ? 'bad' : hf.valor < 2 ? 'warn' : 'ok', pos = Math.max(2, Math.min(98, (hf.valor - 1) / 2 * 100));
    const marca = h('i', {}); marca.style.left = animando ? '2%' : pos + '%';
    if (animando) requestAnimationFrame(() => requestAnimationFrame(() => { marca.style.left = pos + '%'; }));
    f.push(h('div', { class: 'card' }, h('small', {}, 'Fator de saúde (HF) · ' + hf.onde), h('div', { class: 'big ' + c }, num(hf.valor, fmt)),
      h('div', { class: 'hf' }, marca), hf.antigo ? h('div', { class: 'sub' }, 'Leitura antiga: a coleta não atualizou.') : null));
  }
  const pv = timoneiro();
  f.push(...(pv.length ? pv : [h('h2', {}, 'Prévia de hoje'), h('div', { class: 'card' }, h('small', {}, 'Prévia das 7h00'),
    h('div', { class: 'titulo' }, 'Sem prévia hoje'), h('div', { class: 'sub' }, 'Quando sair, os ajustes do dia aparecem aqui com o botão Cancelar.'))]));
  if (tm.modo_taxas) {
    f.push(h('h2', {}, 'Taxas coletadas'), h('div', { class: 'card', role: 'radiogroup', 'aria-label': 'O que o robô faz com as taxas' },
      h('small', {}, 'O que o robô faz com as taxas ao refazer uma posição'),
      MODOS.map(([id, nome, desc]) => {
        const on = id === tm.modo_taxas, bloq = id === 'enviar_taxas' && !tm.enviar_taxas_disponivel;
        const a = { class: 'opc' + (on ? ' on' : ''), type: 'button', role: 'radio', 'aria-checked': String(on), onclick: () => on || comandar({ acao: 'timoneiro_taxas', alvo: id,
          titulo: 'Trocar o modo das taxas?', texto: nome + '. Vale a partir do próximo plano.', aviso: id === 'enviar_taxas' ? 'As taxas vão para a EVM principal, no endereço fixo do PC.' : null, rotulo: 'Trocar' }) };
        if (bloq || (!on && !pcOk())) a.disabled = '';
        return h('button', a, h('i', {}), h('span', {}, nome, h('small', {}, bloq ? 'Indisponível: destino das taxas não configurado no PC.' : desc)));
      })));
  }
  if (mes && mes.atual) {
    const a = mes.atual, max = Math.max(...mes.meses.map(x => x.usd), 1);
    f.push(h('h2', {}, 'Taxas no mês'));
    f.push(h('div', { class: 'card' }, h('small', {}, a.nome), h('div', { class: 'big ok' }, dinNum(a.usd, a.brl)),
      h('div', { class: 'sub' }, `On-chain até ${a.ate} · média ${din(a.media_usd, a.brl != null ? a.media_usd * a.brl / (a.usd || 1) : null)} por dia` + (a.conferidas < a.posicoes ? ` · ${a.conferidas} de ${a.posicoes} posições conferidas` : '')),
      h('div', { class: 'rot', style: 'margin:18px 0 12px;padding-top:14px;border-top:1px solid var(--linha)' }, 'Histórico'),
      mes.meses.map(x => {
        const i = h('i', {}), w = Math.round(100 * x.usd / max);
        if (animando) requestAnimationFrame(() => requestAnimationFrame(() => { i.style.width = w + '%'; })); else { i.style.transition = 'none'; i.style.width = w + '%'; }
        return h('div', {}, h('div', { class: 'mes' }, h('span', {}, x.nome), h('b', {}, din(x.usd, x.brl))), h('div', { class: 'mbar' }, i));
      })));
  }
  f.push(h('div', { class: 'acoes', style: 'margin:2px 0 10px' }, botao('Atualizar carteira', 'cinza', () => comandar({ acao: 'carteira.atualizar', titulo: 'Atualizar a carteira?', texto: 'O PC consulta as fontes de novo. Pode levar vários minutos.', rotulo: 'Atualizar' }))));
  if (m.horario) f.push(h('div', { class: 'sub' }, 'Carteira · ' + m.horario));
  return f;
}

// ---------- Engenheiros (24/11/2026): o que espera o sim do Eduardo, por engenheiro, e a próxima rodada ----------
const pendEng = () => !E ? 0 : Object.keys((E.trading || {}).decisoes || {}).length +
  Object.values((E.garimpo || {}).propostas || {}).filter(p => p.estado === 'aguardando').length;
function engenheiros() {
  const pr = (E.engenheiros || {}).proximas || {}, t = E.trading || {}, g = E.garimpo || {};
  const props = Object.entries(g.propostas || {}).filter(([, p]) => p.estado === 'aguardando' || p.estado === 'aprovada');
  const dec = Object.entries(t.decisoes || {});
  const cab = (nome, prox, n, txt) => h('div', { class: 'card' }, h('div', { class: 'topo-card' }, h('small', { style: 'margin:0' }, 'Engenheiro · ' + nome),
      n ? h('span', { class: 'chip alerta' }, h('i', {}), n + ' por decidir') : h('span', { class: 'chip' }, h('i', {}), txt || 'Nada por decidir')),
    h('div', { class: 'sub', style: 'margin-top:2px' }, prox || 'Próxima rodada: sem informação nesta leitura.'));
  const f = [h('h2', {}, 'Garimpo'), cab('Garimpo', pr.garimpo, props.filter(([, p]) => p.estado === 'aguardando').length)];
  props.forEach(([id, p]) => f.push(h('div', { class: 'card' }, h('small', {}, p.estado === 'aprovada' ? 'Aprovada, falta implementar' : 'Aguardando decisão'), h('div', { class: 'texto' }, p.titulo), p.resumo ? h('div', { class: 'sub' }, p.resumo) : null,
    h('div', { class: 'acoes' }, p.estado === 'aprovada'
      ? [botao('Implementar agora', 'cheio', () => comandar({ acao: 'proposta.implementar', alvo: id, titulo: 'Implementar a proposta?', texto: p.titulo, aviso: AVISO_CLAUDE, rotulo: 'Implementar' }))]
      : [botao('Recusar', 'perigo', () => comandar({ acao: 'proposta.recusar', alvo: id, titulo: 'Recusar a proposta?', texto: p.titulo, rotulo: 'Recusar', perigo: true })),
         botao('Aprovar', 'cheio', () => comandar({ acao: 'proposta.aprovar', alvo: id, titulo: 'Aprovar a proposta?', texto: p.titulo, aviso: AVISO_CLAUDE + ' Aprovar já dispara a implementação.', rotulo: 'Aprovar' }))]))));
  f.push(h('h2', {}, 'Fábrica (Trading)'), cab('Trading', pr.trading, dec.length));
  dec.forEach(([id, texto]) => f.push(h('div', { class: 'card' }, h('small', {}, 'Aguardando decisão'), h('div', { class: 'texto' }, texto), h('div', { class: 'acoes' },
    botao('Detalhes', 'cinza', () => comandar({ acao: 'mesa.detalhes', alvo: id, titulo: 'Detalhes da decisão', direto: true })),
    botao('Recusar', 'perigo', () => comandar({ acao: 'mesa.recusado', alvo: id, titulo: 'Recusar esta decisão?', texto, rotulo: 'Recusar', perigo: true })),
    botao('Aceitar', 'cheio', () => comandar({ acao: 'mesa.aceito', alvo: id, titulo: 'Aceitar esta decisão?', texto, aviso: 'A resposta é gravada e aplicada pelo Chefe da mesa, como no pop-up do PC.', rotulo: 'Aceitar' }))))));
  f.push(h('h2', {}, 'Timoneiro'), cab('Timoneiro', pr.timoneiro || 'Avaliador ainda não criado.', 0, 'Ainda não existe'));
  return f;
}

const hora = q => q.slice(11, 16), dia = q => q.slice(8, 10) + '/' + q.slice(5, 7) + '/' + q.slice(0, 4);
const VOLTA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
function avisos() {
  const todas = E.noticias || [];
  if (aberta) {
    const n = todas.find(x => x.id === aberta);
    if (!n) { aberta = null; return avisos(); }
    const v = h('button', { class: 'voltar', onclick: () => { aberta = null; desenhar('e'); } }, 'Notificações'); v.insertAdjacentHTML('afterbegin', VOLTA);
    return [v, h('div', { class: 'card' }, h('small', {}, `${n.origem} · ${dia(n.quando)} às ${hora(n.quando)}`),
        h('div', { class: 'titulo', style: 'margin:6px 0 14px' }, n.titulo.replace('Bilhete da manhã · ', '')), h('div', { class: 'texto' }, n.texto),
      n.id.includes('/bilhete/') && /problema/i.test(n.titulo)
        ? h('div', { class: 'acoes' }, botao('Conferir', 'cheio', () => comandar({ acao: 'automacoes.conferir', titulo: 'Conferir as automações?', texto: 'O PC confere as automações agora.', aviso: 'Se ainda houver falhas, abre o Claude Code no PC para corrigir.', rotulo: 'Conferir' })))
        : null)];
  }
  const nao = todas.filter(n => !lidas.has(n.id));
  const lista = verLidas ? todas.filter(n => lidas.has(n.id)) : nao;
  const f = [h('div', { class: 'abas' },
    h('button', { class: verLidas ? '' : 'on', onclick: () => { verLidas = false; desenhar('f'); } }, 'Por ler ' + nao.length),
    h('button', { class: verLidas ? 'on' : '', onclick: () => { verLidas = true; desenhar('f'); } }, 'Lidas'))];
  if (!lista.length) f.push(h('div', { class: 'vazio' }, 'Nenhuma notificação nesta lista.'));
  let ult = '';
  const agora = new Date(), hoje = dia(`${agora.getFullYear()}-${String(agora.getMonth() + 1).padStart(2, '0')}-${String(agora.getDate()).padStart(2, '0')}`);
  lista.forEach(n => {
    const d = dia(n.quando) === hoje ? 'Hoje' : dia(n.quando);
    if (d !== ult) { f.push(h('div', { class: 'dia' }, d)); ult = d; }
    f.push(h('div', { class: 'item' + (lidas.has(n.id) ? ' lida' : ''), 'data-o': n.origem, tabindex: '0', role: 'button', onclick: () => { aberta = n.id; lidas.add(n.id); salvarLidas(); vibra(6); desenhar('d'); window.scrollTo(0, 0); } },
      h('div', { class: 'meta' }, n.origem + ' · ' + hora(n.quando)), h('div', { class: 't' }, n.titulo.replace('Bilhete da manhã · ', '')), lidas.has(n.id) ? null : h('i', { class: 'novo' })));
  });
  return f;
}

// modo: 'd'/'e' = troca de aba (desliza), 'f' = só esmaece, undefined = atualização de dados (sem animar)
function desenhar(modo) {
  const t = $('#tela');
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.aba === aba));
  const nav = $('nav'); nav.style.setProperty('--idx', ORDEM.indexOf(aba));
  nav.querySelectorAll('.tab .n').forEach(x => x.remove());
  if (!E) { t.className = ''; t.replaceChildren(h('div', { class: 'sk' }), h('div', { class: 'sk', style: 'height:150px' }), h('div', { class: 'sk' })); return; }
  const nao = (E.noticias || []).filter(n => !lidas.has(n.id)).length;
  if (nao) nav.querySelector('[data-aba=avisos]').append(h('span', { class: 'n' }, String(nao)));
  const pend = pendEng();
  if (pend) nav.querySelector('[data-aba=engenheiros]').append(h('span', { class: 'n eng' }, String(pend)));
  animando = !!modo;
  t.className = modo || '';
  const filhos = { fabrica, garimpo, timoneiro: timoneiroAba, engenheiros, avisos }[aba]();
  t.replaceChildren(...filhos);
  [...t.children].forEach((c, i) => c.style.setProperty('--i', Math.min(i, 9)));
  if (modo) contar();
  animando = false;
}
function tocar(nome) {
  const b = document.querySelector(`.tab[data-aba=${nome}]`); if (!b) return;
  b.classList.remove('tocar'); void b.offsetWidth; b.classList.add('tocar'); setTimeout(() => b.classList.remove('tocar'), 1000);
}
function ir(nova) {
  const mesma = nova === aba;
  const modo = ORDEM.indexOf(nova) >= ORDEM.indexOf(aba) ? 'd' : 'e';
  aba = nova; aberta = null; localStorage.setItem('bilbao_aba', aba);
  vibra(8); tocar(nova); desenhar(mesma ? 'f' : modo); window.scrollTo({ top: 0, behavior: reduz ? 'auto' : 'smooth' });
}

async function carregar() {
  if (carregando) return;
  carregando = true;
  try {
    const v = await lerChave('bilbao_estado');
    if (!v || !Number.isFinite(Date.parse(v.em))) throw new Error('sem dados');
    conexaoOk = true;
    try { TIM = (await lerChave('timoneiro_previa')) || null; } catch {}   // sem a chave, a seção do Timoneiro só não aparece
    if (!E && !localStorage.getItem('bilbao_lidas')) {   // 1ª vez: o que tem mais de 1 dia já nasce lido
      const corte = Date.now() - 864e5;
      (v.noticias || []).forEach(n => { if (new Date(n.quando).getTime() < corte) lidas.add(n.id); });
      salvarLidas();
    }
    const primeira = !E;
    if (!E || Date.parse(v.em) >= Date.parse(E.em)) {
      E = v;
      try { localStorage.setItem(cacheBilbao, JSON.stringify(E)); } catch {}
    }
    const min = Math.max(0, (Date.now() - Date.parse(E.em)) / 60000);
    const txt = min < 2 ? 'Atualizado agora' : 'Atualizado há ' + (min < 90 ? Math.round(min) + ' min' : Math.round(min / 60) + ' h');
    $('#quando span').textContent = txt; $('#quando').className = min > 3 ? 'old' : '';
    $('#aviso').style.display = min > 3 ? 'block' : 'none';
    $('#aviso').textContent = 'O PC não publicou uma leitura recente. O que você vê é a última leitura recebida.';
    if (!aberta && !$('#veu').classList.contains('on')) desenhar(primeira ? 'f' : undefined);
  } catch (e) {
    conexaoOk = false;
    $('#quando span').textContent = 'Sem conexão'; $('#quando').className = 'old';
    $('#aviso').style.display = 'block';
    const servidor = /Supabase 5\d\d|abort/i.test(String(e && (e.message || e.name)));
    $('#aviso').textContent = (servidor ? 'O servidor (Supabase) está fora do ar; o PC segue normal. ' : 'Falha ao atualizar. ') +
      (E ? 'Exibindo a leitura de ' + new Date(E.em).toLocaleString('pt-BR') + '. Volta sozinho.' : 'A primeira leitura está indisponível. O Bilbao vai tentar de novo automaticamente.');
  } finally {
    carregando = false;
  }
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => ir(b.dataset.aba));
$('#quando').onclick = () => { vibra(6); carregar(true); };
marcarCfg(); desenhar(); carregar();
setInterval(carregar, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) carregar(); });
window.addEventListener('online', carregar);
window.addEventListener('pageshow', carregar);
</script>
